<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공구 빠른등록</title>
<style>
  :root { --primary: #1a73e8; --bg: #f5f6f8; --border: #e2e5ea; --text: #202124; --text-sub: #5f6368; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Malgun Gothic", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; }
  .card { max-width: 420px; margin: 0 auto; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: var(--text-sub); margin: 0 0 14px; }
  .thumb { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; background: #eee; }
  label { display: block; font-size: 12px; color: var(--text-sub); margin: 10px 0 4px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 46px; }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }
  .hint { font-size: 11px; color: #ef6c00; margin-top: 4px; }
  .hint.ok { color: #1e8e3e; }
  button.submit {
    width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.submit:disabled { background: #bbb; cursor: not-allowed; }
  .result { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
  .result.ok { background: #e6f4ea; color: #1e8e3e; display: block; }
  .result.err { background: #fce8e6; color: #c5221f; display: block; }
  .setup-banner { max-width: 420px; margin: 0 auto 14px; padding: 12px 14px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; font-size: 12px; line-height: 1.6; display: none; }
</style>
</head>
<body>

<div class="setup-banner" id="setupBanner">
  ⚙️ <code>CONFIG.APPS_SCRIPT_URL</code> 이 비어있습니다. <b>apps_script/Code.gs</b>를 구글시트에 배포한 뒤 웹 앱 URL을 이 파일 상단에 채워주세요.
</div>

<div class="card">
  <h1>📌 공구 빠른등록</h1>
  <p class="sub">인스타그램 게시물 링크에서 자동으로 가져온 정보입니다. 확인 후 등록하세요.</p>

  <img id="thumb" class="thumb">

  <label>제품명</label>
  <input type="text" id="product" placeholder="게시물 캡션에서 자동 추출됨 (수정 가능)">

  <label>셀러</label>
  <select id="seller"><option value="">셀러 선택</option></select>
  <div class="hint" id="sellerHint"></div>

  <label>카테고리</label>
  <select id="category"><option value="">카테고리 선택</option></select>

  <label>진행채널</label>
  <select id="channel"><option value="">채널 선택</option></select>

  <div class="row2">
    <div><label>오픈일</label><input type="date" id="openDate"></div>
    <div><label>마감일</label><input type="date" id="closeDate"></div>
  </div>

  <div class="row2">
    <div><label>정가(원, 선택)</label><input type="number" id="listPrice"></div>
    <div><label>판매가(원, 선택)</label><input type="number" id="salePrice"></div>
  </div>

  <label>등록자</label>
  <input type="text" id="registrant" placeholder="이름">

  <label>비고 (원본 링크 자동 포함)</label>
  <textarea id="note"></textarea>

  <button class="submit" id="submitBtn">시트에 등록하기</button>
  <div class="result" id="result"></div>
</div>

<script>
// ================= 설정 =================
const CONFIG = {
  SHEET_ID: "1d30sDinI7l6zb-lvXASZPs_mjf0AEA9Ty82IqAnagGU",
  GID: { seller: "60505954", category: "184232809", channel: "854552869" },
  APPS_SCRIPT_URL: "", // apps_script/Code.gs 배포 후 웹 앱 URL을 여기에 입력
};
// =========================================

const RANGE = { seller: "A3:K1000", category: "A3:D1000", channel: "A3:D1000" };
const FIELD_MAP = {
  seller: { "셀러ID":"id","셀러명":"name","인스타그램 핸들":"igHandle","주요카테고리ID":"catId" },
  category: { "카테고리ID":"id","대분류":"major","소분류":"minor" },
  channel: { "채널ID":"id","채널유형":"type","채널명":"name" },
};
const DATA = { seller: [], category: [], channel: [] };

function qs(name) { return new URLSearchParams(location.search).get(name) || ''; }

function parseGviz(resp, key) {
  const cols = resp.table.cols.map(c => c.label);
  const map = FIELD_MAP[key];
  const idx = {};
  cols.forEach((label, i) => { if (map[label]) idx[map[label]] = i; });
  const out = [];
  for (const row of resp.table.rows) {
    const cells = row.c;
    const get = (f) => { const i = idx[f]; if (i === undefined || !cells[i]) return null; const c = cells[i]; return c.f ?? c.v; };
    const raw = {};
    Object.values(map).forEach(f => raw[f] = get(f));
    if (!raw.id) continue;
    out.push(raw);
  }
  return out;
}

let loaded = 0;
function loadMaster(key) {
  const handler = `__qa_gviz_${key}`;
  window[handler] = (resp) => {
    DATA[key] = parseGviz(resp, key);
    loaded++;
    if (loaded === 3) onMastersLoaded();
  };
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${handler}&gid=${CONFIG.GID[key]}&range=${RANGE[key]}&headers=1&_ts=${Date.now()}`;
  const s = document.createElement('script'); s.src = url;
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 8000);
}

function onMastersLoaded() {
  const sellerSel = document.getElementById('seller');
  DATA.seller.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; o.dataset.ig = (s.igHandle || '').replace('@', '').toLowerCase(); sellerSel.appendChild(o); });
  const catSel = document.getElementById('category');
  DATA.category.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.major}>${c.minor}`; catSel.appendChild(o); });
  const chSel = document.getElementById('channel');
  DATA.channel.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; if (c.type === '인스타그램' && !chSel.value) chSel.value = c.id; chSel.appendChild(o); });
  if (!chSel.value) { const igOpt = [...chSel.options].find(o => DATA.channel.find(c => c.id === o.value && c.type === '인스타그램')); if (igOpt) chSel.value = igOpt.value; }

  applyAutoFill();
}

// ---------- 쿼리 파라미터(북마클릿에서 전달)로 초기값 채우기 ----------
function applyAutoFill() {
  const title = decodeURIComponent(qs('title'));
  const image = decodeURIComponent(qs('image'));
  const url = decodeURIComponent(qs('url'));
  const username = decodeURIComponent(qs('user')).toLowerCase();

  if (image) { const t = document.getElementById('thumb'); t.src = image; t.style.display = 'block'; }

  // og:title 형식: "{username} on Instagram: "캡션 내용""  → 캡션만 추출 시도
  let product = title;
  const m = title.match(/on Instagram:\s*[“"]?([^”"]+)[”"]?/i);
  if (m) product = m[1].trim();
  document.getElementById('product').value = product.slice(0, 60);

  document.getElementById('note').value = url ? `원본: ${url}` : '';
  document.getElementById('openDate').value = new Date().toISOString().slice(0, 10);

  const savedName = localStorage.getItem('gongu_registrant');
  if (savedName) document.getElementById('registrant').value = savedName;

  // 셀러 자동 매칭
  const sellerSel = document.getElementById('seller');
  const hint = document.getElementById('sellerHint');
  if (username) {
    const match = [...sellerSel.options].find(o => o.dataset.ig === username);
    if (match) {
      sellerSel.value = match.value;
      hint.textContent = `@${username} → 셀러마스터에서 자동 매칭됨`;
      hint.className = 'hint ok';
    } else {
      hint.textContent = `@${username} 이(가) 셀러마스터에 없습니다. 먼저 셀러마스터에 등록하거나, 등록 후 이 행의 셀러ID를 시트에서 수정하세요.`;
      hint.className = 'hint';
    }
  }

  // 카테고리 자동 추정 (제품명에 카테고리 소분류 텍스트가 포함되는 경우)
  const catSel = document.getElementById('category');
  const guess = [...catSel.options].find(o => o.textContent.split('>')[1] && product.includes(o.textContent.split('>')[1]));
  if (guess) catSel.value = guess.value;
}

// ---------- 등록 ----------
document.getElementById('submitBtn').addEventListener('click', async () => {
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  const registrant = document.getElementById('registrant').value.trim();
  if (registrant) localStorage.setItem('gongu_registrant', registrant);

  const payload = {
    product: document.getElementById('product').value.trim(),
    catId: document.getElementById('category').value,
    sellerId: document.getElementById('seller').value,
    channelId: document.getElementById('channel').value,
    openDate: document.getElementById('openDate').value,
    closeDate: document.getElementById('closeDate').value,
    listPrice: document.getElementById('listPrice').value,
    salePrice: document.getElementById('salePrice').value,
    registrant: registrant,
    note: document.getElementById('note').value,
    sourceUrl: qs('url') ? decodeURIComponent(qs('url')) : '',
  };

  if (!CONFIG.APPS_SCRIPT_URL) {
    document.getElementById('setupBanner').style.display = 'block';
    return;
  }
  if (!payload.product) { alert('제품명을 입력해주세요.'); return; }

  btn.disabled = true; btn.textContent = '등록 중...';
  try {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok) {
      result.className = 'result ok';
      result.textContent = `등록 완료! (공동구매마스터 ${data.row}행) 가격·수량 등 나머지 정보는 시트에서 마저 채워주세요.`;
      btn.textContent = '등록 완료';
    } else {
      throw new Error(data.error || '알 수 없는 오류');
    }
  } catch (err) {
    result.className = 'result err';
    result.textContent = `등록 실패: ${err.message}`;
    btn.disabled = false; btn.textContent = '다시 시도';
  }
});

if (!CONFIG.APPS_SCRIPT_URL) document.getElementById('setupBanner').style.display = 'block';
loadMaster('seller'); loadMaster('category'); loadMaster('channel');
</script>

</body>
</html>
